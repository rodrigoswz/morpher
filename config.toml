enable-magisk-update = true
logging-to-file = true
compression-level = 9
parallel-jobs = 1

patches-version = "latest"   # 'latest', 'dev', or a version number. default: "latest"
cli-version = "latest"       # 'latest', 'dev', or a version number. default: "latest"

[YouTube]
enabled = true
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "both"
include-stock = "merged"
riplib = true
arch = "arm64-v8a"
excluded-patches = "'Custom branding' 'Enable debugging'"
patcher-args = "-e 'Hide Shorts components' -OhideShortsAppShortcut=true -OhideShortsWidget=true"
archive-dlurl = "https://archive.org/download/geologically/apks/com.google.android.youtube"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"

[Gboard]
enabled = true
app-name = "Gboard"
rv-brand = "jasonwu1994"
riplib = true
arch = "arm64-v8a"
patches-source = "jasonwu1994/Gboard-patches"
cli-source = "MorpheApp/morphe-cli"
uptodown-dlurl = "https://gboard-go.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard"

[Microsoft-Edge]
enabled = false
app-name = "Edge"
rv-brand = "quantavil"
riplib = true
arch = "arm64-v8a"
patches-source = "quantavil/edge-morphe-patches"
cli-source = "MorpheApp/morphe-cli"
included-patches = "'Disable Play Store updates'"
uptodown-dlurl = "https://microsoft-edge.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/microsoft-corporation/microsoft-edge"
